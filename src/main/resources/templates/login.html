<!doctype html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
  </head>
  <body>
    <h1>Inicia sessió</h1>

    <form action="/login" method="post" th:object="${loginForm}">
      <div>
        <input type="text" th:field="*{username}" placeholder="Usuari" />
        <span
          th:if="${#fields.hasErrors('username')}"
          th:errors="*{username}"
          style="color: red"
        ></span>
      </div>

      <div>
        <input
          type="password"
          th:field="*{password}"
          placeholder="Contrasenya"
        />
        <span
          th:if="${#fields.hasErrors('password')}"
          th:errors="*{password}"
          style="color: red"
        ></span>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <p th:if="${message}" th:text="${message}" style="color: red"></p>
    <p>Encara no tens usuari? <a th:href="@{/register}">Registra't</a></p>
  </body>
</html>
